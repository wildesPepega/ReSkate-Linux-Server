name: Set up the release build
description: Rust, Zig and cargo-zigbuild, as package-linux.sh needs them (docs/building.md).
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Zig and cargo-zigbuild
      shell: bash
      run: |
        python -m pip install --quiet ziglang cargo-zigbuild
        # package-linux.sh looks for a `zig` command; the pip package is run through Python.
        mkdir -p "$HOME/.local/bin"
        printf '#!/bin/sh\nexec python -m ziglang "$@"\n' > "$HOME/.local/bin/zig"
        chmod +x "$HOME/.local/bin/zig"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Rust
      shell: bash
      run: rustup toolchain install stable --profile minimal && rustup default stable
    - uses: Swatinem/rust-cache@v2
